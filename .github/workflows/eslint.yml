name: ESLint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
    - uses: actions/checkout@v2
    - name: Install pnpm and Node.js
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
      with:
        runtime: node@${{matrix.node-version}}
        cache: true
    - name: Run ESLint
      run: pnpm eslint .